name: Sawti QA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2 libsndfile1 ffmpeg zsh
      - run: python -m pip install -r requirements-cloud.lock
      - run: python -m pip check
      - run: python helpers/build_source_manifest.py --check
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/browser_safety.cjs
      - run: node --test tests/uninstall_ui.cjs
      - run: python tests/http_smoke.py
      - run: zsh -n INSTALL_SAWTI.command launch.sh START_SAWTI.command SIMULATE_SAWTI.command UNINSTALL_SAWTI.command
  macos-uninstall-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: swiftc -swift-version 5 helpers/sawti-audio.swift -o /tmp/sawti-audio-check
      - run: osacompile -l JavaScript -o /tmp/sawti-uninstall-check.scpt helpers/uninstall-ui.js
      - run: python -m unittest discover -s tests -p test_uninstall.py -v
